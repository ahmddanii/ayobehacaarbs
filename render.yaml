# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Proyek: Ayo Behacaar (Laravel 13 + Livewire 4 + SQLite)
# ==============================================================================
# Petunjuk Penggunaan:
# 1. Pastikan file ini berada di root folder proyek Anda.
# 2. Push file ini ke GitHub Anda.
# 3. Di dashboard Render, pilih "Blueprints" lalu klik "New Blueprint Instance".
# 4. Hubungkan repositori GitHub Anda, dan Render akan otomatis mendeteksi konfigurasi ini!
# ==============================================================================

services:
  - type: web
    name: ayobehacaar
    env: php
    plan: free
    
    # Perintah kompilasi composer dependencies dan aset frontend Vite
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build"
    
    # Perintah start: Pastikan file database.sqlite ada, jalankan migrasi database + seeder admin, lalu jalankan Apache
    startCommand: "mkdir -p database && touch database/database.sqlite && php artisan migrate --force --seed && apachectl -D FOREGROUND"
    
    envVars:
      # Mode produksi & nonaktifkan debug info demi keamanan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      
      # Kunci aplikasi: Render akan meminta Anda memasukkan APP_KEY saat deploy (buat menggunakan 'php artisan key:generate' di lokal)
      - key: APP_KEY
        sync: false
      
      # Gunakan SQLite sebagai database agar 100% gratis tanpa setup database eksternal
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /opt/render/project/src/database/database.sqlite
      
      # Salurkan log langsung ke log dashboard Render
      - key: LOG_CHANNEL
        value: stderr
      
      # Pengaturan sesi, cache, dan antrean menggunakan database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
